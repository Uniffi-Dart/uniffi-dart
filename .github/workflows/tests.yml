on:
  push:
    branches:
      - "main"
      - "release/**"
  pull_request:

name: Testing

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
          - "1.85"
          - nightly
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Use cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Install Dart toolchain
        uses: dart-lang/setup-dart@v1

      - name: Run cargo nextest
        # --all-features so the `binary`-gated CLI (src/bin.rs) is compiled too.
        run: cargo nextest run --all --all-features

  lints:
    name: Lints
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
          - "1.85"
          - nightly
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy rustfmt

      - name: Use cache
        uses: Swatinem/rust-cache@v2
          
      - name: Format
        run: cargo fmt --all -- --check

      - name: Test CI result reporting
        run: python3 -m unittest discover -s .github/scripts -p '*_test.py'

      - name: Clippy
        # Include every fixture and macro crate as well as the generator's CLI.
        # UniFFI 0.31 scaffolding requires const MetadataBuffers to build its static metadata.
        run: cargo clippy --workspace --all-features --all-targets --keep-going -- -D warnings -A clippy::large_const_arrays
