on:
  push:
    branches:
      - "main"
      - "release/**"
  pull_request:

name: Test Downstream

jobs:
  test-payjoin:
    name: Test rust-payjoin Bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout rust-payjoin
        uses: actions/checkout@v4
        with:
          repository: payjoin/rust-payjoin
          path: rust-payjoin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Use cache
        uses: Swatinem/rust-cache@v2

      - name: Patch uniffi-dart dependency
        run: |
          # The Dart native hook builds a separate Cargo workspace through this overlay.
          for manifest in rust-payjoin/Cargo.toml rust-payjoin/payjoin-ffi/dart/.cargo/config.local.toml; do
            cat >> "$manifest" << EOF

          [patch.'https://github.com/Uniffi-Dart/uniffi-dart.git']
          uniffi-dart = { path = "$GITHUB_WORKSPACE/main" }
          EOF
          done

      - name: Use stable Rust for the Dart native hook
        run: |
          # The downstream hook otherwise selects Rust 1.85.1, which cannot build
          # its newly resolved dependencies. Match the toolchain installed above.
          # native_toolchain_rust requires an exact release and an explicit target.
          rust_version=$(rustc +stable --version | cut -d ' ' -f 2)
          rust_target=$(rustc +stable -vV | sed -n 's/^host: //p')
          cat > rust-payjoin/payjoin-ffi/dart/native/rust-toolchain.toml << EOF
          [toolchain]
          channel = "$rust_version"
          profile = "minimal"
          targets = ["$rust_target"]
          EOF

      - name: Generate dart bindings and run tests
        run: cd rust-payjoin/payjoin-ffi/dart && bash scripts/generate_bindings.sh && dart test

  test-bdk:
    name: Test bdk-dart Bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout bdk-dart
        uses: actions/checkout@v4
        with:
          repository: bitcoindevkit/bdk-dart
          path: bdk-dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Use cache
        uses: Swatinem/rust-cache@v2

      - name: Patch uniffi-dart dependency
        run: |
          cat >> bdk-dart/native/Cargo.toml << 'EOF'

          [patch.'https://github.com/Uniffi-Dart/uniffi-dart']
          uniffi-dart = { path = "../../main" }
          EOF

      - name: Refresh lockfile for patched generator
        run: cargo update --manifest-path bdk-dart/native/Cargo.toml -p uniffi-dart

      - name: Generate dart bindings and run tests
        run: cd bdk-dart && bash scripts/generate_bindings.sh && dart test
