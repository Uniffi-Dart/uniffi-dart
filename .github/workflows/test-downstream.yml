on:
  push:
    branches:
      - "main"
      - "release/**"
  pull_request:

name: Test Downstream

# The downstream repos are separate workspaces and do not inherit this repo's
# .cargo/config.toml resolver setting, so it is set here. rust-payjoin's crates
# declare rust-version 1.85, which keeps its resolution 1.85-compatible.
# bdk-dart and bdk-ffi declare none; cargo then resolves against the *active*
# rustc, so their lockfile refresh must run under the pinned 1.88.0 toolchain.
env:
  CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

jobs:
  test-payjoin:
    name: Test rust-payjoin Bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout rust-payjoin
        uses: actions/checkout@v4
        with:
          repository: payjoin/rust-payjoin
          path: rust-payjoin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Use cache
        uses: Swatinem/rust-cache@v2

      - name: Patch uniffi-dart dependency
        run: |
          cat >> rust-payjoin/Cargo.toml << 'EOF'

          [patch.'https://github.com/Uniffi-Dart/uniffi-dart.git']
          uniffi-dart = { path = "../main" }
          EOF

      - name: Bump payjoin-ffi to uniffi 0.32
        # rust-payjoin still pins uniffi 0.31.2; its 0.31 metadata cannot be read
        # by this PR's 0.32 bindgen (`Unexpected metadata type code`). Bump its
        # own uniffi to 0.32 so the metadata matches — payjoin-ffi compiles and
        # its Dart suite passes unchanged on 0.32 (probed: 24 tests). Removed once
        # rust-payjoin ships 0.32 upstream.
        run: |
          sed -i 's/uniffi = { version = "0.31.2"/uniffi = { version = "0.32"/g' rust-payjoin/payjoin-ffi/Cargo.toml
          # rust-payjoin has two toolchain files and this job uses both: the root
          # pins a nightly that generate_bindings.sh picks up (it builds from
          # payjoin-ffi/), and payjoin-ffi/dart/native pins 1.85.1 for the
          # native-assets build, below the 1.88 that uniffi 0.32 needs. Pin both to
          # our MSRV (1.88.0) so the job builds on the floor we declare.
          # native_toolchain_rust requires an *exact* channel and a `targets` list,
          # so list just the Linux host target (the CI only builds for the host).
          for f in $(find rust-payjoin -name rust-toolchain.toml); do
            printf '[toolchain]\nchannel = "1.88.0"\ntargets = ["x86_64-unknown-linux-gnu"]\n' > "$f"
          done
          echo "--- payjoin-ffi uniffi pins now ---"
          grep -n 'uniffi = ' rust-payjoin/payjoin-ffi/Cargo.toml || true

      - name: Generate dart bindings and run tests
        run: cd rust-payjoin/payjoin-ffi/dart && bash scripts/generate_bindings.sh && dart test

  test-bdk:
    name: Test bdk-dart Bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout bdk-dart
        uses: actions/checkout@v4
        with:
          repository: bitcoindevkit/bdk-dart
          path: bdk-dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Use cache
        uses: Swatinem/rust-cache@v2

      - name: Fetch and bump bdk-ffi to uniffi 0.32
        # bdk-dart re-exports bdk-ffi, pinned by git tag v3.1.0 at uniffi 0.31.2 —
        # so the metadata bdk_dart_ffi embeds is 0.31 and this PR's 0.32 bindgen
        # cannot read it. Clone the commit that tag points to, bump its uniffi to
        # 0.32, and `[patch]` bdk-dart onto the local copy. The rev must track
        # bdk-dart's pin: if the crate versions differ, cargo silently ignores the
        # patch. Removed once bdk-ffi ships 0.32 upstream.
        run: |
          BDK_FFI_REV=5fa4898a4dc6d1c3df12f2676a662149eff500ff # tag v3.1.0
          git init -q bdk-ffi
          git -C bdk-ffi remote add origin https://github.com/bitcoindevkit/bdk-ffi.git
          git -C bdk-ffi fetch --depth 1 origin "$BDK_FFI_REV" -q
          git -C bdk-ffi checkout -q FETCH_HEAD
          sed -i 's/uniffi = { version = "=0.31.2"/uniffi = { version = "0.32"/g' bdk-ffi/bdk-ffi/Cargo.toml
          echo "--- bdk-ffi uniffi pins now ---"
          grep -n 'uniffi = ' bdk-ffi/bdk-ffi/Cargo.toml || true

      - name: Patch bdk-dart onto uniffi 0.32 (uniffi, uniffi-dart, bdk-ffi)
        run: |
          # bdk-dart's own native crate also pins uniffi 0.31.2 — bump it too.
          sed -i 's/uniffi = { version = "=0.31.2"/uniffi = { version = "0.32"/g' bdk-dart/native/Cargo.toml
          cat >> bdk-dart/native/Cargo.toml << 'EOF'

          [patch.'https://github.com/Uniffi-Dart/uniffi-dart']
          uniffi-dart = { path = "../../main" }

          [patch.'https://github.com/bitcoindevkit/bdk-ffi.git']
          bdk-ffi = { path = "../../bdk-ffi/bdk-ffi" }
          EOF
          # Keep the committed lockfile: bdk-dart's script runs `cargo build
          # --locked`. The "Refresh lockfile" step below updates only what the
          # patches change.
          # bdk-dart pins rustc 1.85.1 and bdk-ffi 1.90.0; uniffi 0.32 needs 1.88.
          # native_toolchain_rust requires an *exact* channel and a `targets` list,
          # so pin our MSRV (1.88.0) with just the Linux host target.
          for f in $(find bdk-dart bdk-ffi -name rust-toolchain.toml); do
            printf '[toolchain]\nchannel = "1.88.0"\ntargets = ["x86_64-unknown-linux-gnu"]\n' > "$f"
          done
          echo "--- bdk-dart native uniffi pins now ---"
          grep -n 'uniffi = ' bdk-dart/native/Cargo.toml || true

      - name: Refresh lockfile for patched generator
        # Run inside native/ so rustup picks up the 1.88.0 toolchain file; from the
        # workspace root it would resolve under `stable` and lock packages newer
        # than 1.88 allows. Also move `toml` to 1.x: bdk-dart's lockfile holds
        # toml 0.9, which uniffi_bindgen 0.32 would keep reusing while uniffi-dart
        # requires toml 1, splitting the crate (E0053 on `new_config`).
        working-directory: bdk-dart/native
        run: cargo update -p uniffi-dart -p toml@0.9

      - name: Generate dart bindings and run tests
        run: cd bdk-dart && bash scripts/generate_bindings.sh && dart test
